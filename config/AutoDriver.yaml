behaviors:
  AutoDriver:
    # --- 알고리즘 ---
    trainer_type: ppo

    # --- 하이퍼파라미터 ---
    hyperparameters:
      batch_size: 2048            # buffer 비율 20:1 → gradient noise 증가로 local optima 탈출
      buffer_size: 40960          # 8대 × 512 × 10 rounds (충분한 다양성 확보)
      learning_rate: 3.0e-4
      beta: 1.0e-2                # entropy 탐색 강화 → plateau 탈출 지원
      epsilon: 0.2                # PPO 클리핑 범위
      lambd: 0.95                 # GAE lambda
      num_epoch: 3
      learning_rate_schedule: linear

    # --- 네트워크 ---
    network_settings:
      normalize: true             # observation running mean/std 정규화
      hidden_units: 256
      num_layers: 2
      memory:
        memory_size: 128          # LSTM hidden state 크기 (hidden_units의 절반)
        sequence_length: 64       # BPTT 길이 - batch_size(4096)의 약수 필수 (4096/64=64 ✅)

    # --- 보상 신호 ---
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # --- 학습 제어 ---
    # Residual RL은 base policy 위에 보정하므로 수렴이 빠름
    max_steps: 10000000           # 8대 동시 학습 기준 충분한 총 스텝
    time_horizon: 256             # heading/lateral dense reward 추가 → 짧은 horizon에서 credit assignment 효율적
    summary_freq: 10000           # 8대 수집 속도에 맞춘 로그 주기
    keep_checkpoints: 5
    checkpoint_interval: 50000
    threaded: true

env_settings:
  # Unity Editor가 초기화/리셋 응답을 늦게 보내도 타임아웃으로 학습이 끊기지 않도록 크게 설정
  timeout_wait: 86400
